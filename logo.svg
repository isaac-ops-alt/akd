<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" role="img" aria-label="I'DART Logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4860A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C1D95;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Accent brushstroke behind text -->
  <path d="M 8 78 Q 80 85, 160 78 Q 240 71, 310 78" stroke="url(#goldGrad)" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- "I" letter -->
  <text x="12" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="url(#goldGrad)" filter="url(#glow)">I</text>

  <!-- Apostrophe as artistic paint splash -->
  <g transform="translate(42, 10)">
    <ellipse cx="4" cy="8" rx="3.5" ry="6" fill="url(#purpleGrad)" transform="rotate(-20, 4, 8)"/>
    <ellipse cx="4" cy="8" rx="2" ry="3.5" fill="#F5C842" transform="rotate(-20, 4, 8)" opacity="0.8"/>
    <!-- Small splatter dots -->
    <circle cx="10" cy="4" r="1.5" fill="#F5C842" opacity="0.6"/>
    <circle cx="12" cy="10" r="1" fill="#7C3AED" opacity="0.5"/>
    <circle cx="0" cy="2" r="1" fill="#F5C842" opacity="0.4"/>
  </g>

  <!-- "DART" letters -->
  <text x="56" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="white">DART</text>

  <!-- Underline accent -->
  <rect x="12" y="80" width="295" height="2.5" rx="1.5" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="12" y="100" font-family="'Arial', sans-serif" font-size="10" font-weight="400" fill="#C4B5FD" letter-spacing="2.5">L'ART AU CŒUR DE LA PASSION</text>
</svg>
